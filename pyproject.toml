[project]
name = "agentv5"
version = "0.0.1"
dependencies = [
  "openai",
  "pydantic>=2.0",
  "PyYAML",
  "python-dotenv",
  "questionary",
  "chromadb",
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
]

[project.scripts]
agentv5 = "agent.cli:main"
agentv5-web = "agent.webservice:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
exclude = ["resources*"]

[tool.setuptools.package-data]
agent = ["config.yml", "static/*", "templates/*"]
