<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session {{ session_id }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      .message { border-bottom: 1px solid var(--border); padding: 12px 0; }
      .message:last-child { border-bottom: none; }
      .role { font-weight: 700; color: #a5b4fc; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0; font-family: inherit; }
      details { margin-top: 8px; }
      summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand"><span class="dot"></span> Session {{ session_id[:8] }}&hellip;</div>
        <a class="chip" href="/?username={{ username }}">&larr; Dashboard</a>
      </div>

      <div class="panel">
        <form method="post" action="/sessions/{{ session_id }}/summary">
          <input type="hidden" name="username" value="{{ username }}" />
          <label>Summary</label>
          <input type="text" name="summary" placeholder="Set a session summary" />
          <button type="submit" class="secondary">Save summary</button>
        </form>
      </div>

      <div class="panel">
        {% for message in messages %}
          <div class="message">
            <div class="role">{{ message.role }} <span class="muted">(#{{ message._message_id }})</span></div>
            <pre>{{ message.content if message.content is not none else message }}</pre>
            <details>
              <summary>Edit / delete</summary>
              <form method="post" action="/sessions/{{ session_id }}/messages/{{ message._message_id }}/update">
                <input type="hidden" name="username" value="{{ username }}" />
                <textarea name="content" rows="3">{{ message.content if message.content is not none else '' }}</textarea>
                <button type="submit" class="secondary">Save</button>
              </form>
              <form class="inline" method="post" action="/sessions/{{ session_id }}/messages/{{ message._message_id }}/delete" onsubmit="return confirm('Delete this message?')">
                <input type="hidden" name="username" value="{{ username }}" />
                <button type="submit" class="danger">Delete message</button>
              </form>
            </details>
          </div>
        {% else %}
          <p class="muted">No messages found for this session.</p>
        {% endfor %}
      </div>

      <div class="panel">
        <h2>Add message</h2>
        <form method="post" action="/sessions/{{ session_id }}/messages/add">
          <input type="hidden" name="username" value="{{ username }}" />
          <label>Role</label>
          <select name="role">
            <option value="user">user</option>
            <option value="assistant">assistant</option>
            <option value="system">system</option>
          </select>
          <label>Content</label>
          <textarea name="content" rows="4" required></textarea>
          <button type="submit">Add message</button>
        </form>
      </div>
    </div>
  </body>
</html>
