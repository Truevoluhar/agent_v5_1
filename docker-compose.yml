services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - .env
    environment:
      - AGENT_DATA_ROOT=/data
    volumes:
      - ./data:/data
    # Example: docker compose run --rm agent --username alice --workspace agent_workspace --interactive false --test false --initial_prompt "..."
    entrypoint: ["agentv5"]

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      - AGENT_DATA_ROOT=/data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
