services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - .env
    environment:
      - AGENT_DATA_ROOT=/data
    volumes:
      - ./data:/data
    # Optional CLI adapter - one-shot runs. The persistent agent-api service
    # below is the recommended way to drive the agent loop (see
    # "Agent GUI Integration.pdf").
    # Example: docker compose run --rm agent --username alice --workspace agent_workspace --interactive false --test false --initial_prompt "..."
    entrypoint: ["agentv5"]

  agent-api:
    build:
      context: .
      dockerfile: service/Dockerfile
    env_file:
      - .env
    environment:
      - AGENT_DATA_ROOT=/data
    volumes:
      - ./data:/data
    ports:
      - "8100:8100"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      - AGENT_DATA_ROOT=/data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

