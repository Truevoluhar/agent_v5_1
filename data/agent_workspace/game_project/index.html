<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Canvas Igra</title>
</head>
<body>
    <!-- Začetni zaslon -->
    <div id="startScreen">
        <h1>Dobrodošli v igri!</h1>
        <p>Natanko kontrolirajte lik s tipkovnico (puščice ali WASD).</p>
        <p>Pripravite se na zabavo!</p>
        <button id="startButton">Začni igro</button>
    </div>

    <!-- Zaslon igre s canvas elementom -->
    <div id="gameScreen" style="display:none;">
        <canvas id="gameCanvas"></canvas>
        <div id="scoreDisplay">Rezultat: 0</div>
    </div>

    <!-- Konec igre -->
    <div id="gameOverScreen" style="display:none;">
        <h2>Konec igre</h2>
        <p id="finalScore">Vaš rezultat: 0</p>
        <button id="restartButton">Ponovno začni</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
