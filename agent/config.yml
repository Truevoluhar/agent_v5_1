# Chat Completions is supported by both OpenAI and vLLM.
llm:
  api_mode: chat_completions
  reasoning_effort: null
  timeout: 120
  # auto disables verification only for the exact public OpenAI API hostname.
  # Internal vLLM and every other endpoint keep certificate verification enabled.
  verify_ssl: auto
  extra_body: {}

agents_resources: resources/agents
workspace: agent_workspace
session: ./session
memory: ./memory
max_steps: 100
# A worker yields to the orchestrator after each batch; durable work survives.
max_worker_iterations: 100

context_limits:
  max_system_message_chars: 10000
  max_input_chars: 22000
  max_message_chars: 10000
  max_tool_output_chars: 10000
  min_recent_messages: 3
  max_retries: 4

orchestrator_agent:
  name: ORCHESTRATOR
  model: gpt-4.1-mini
  temperature: 1.0
  base_url: https://api.openai.com/v1
  api_key: OPENAI_API_KEY

memory_agent:
  name: MEMORY
  model: gpt-4.1-mini
  temperature: 1.0
  base_url: https://api.openai.com/v1
  api_key: OPENAI_API_KEY

response_agent:
  name: RESPONSE
  model: gpt-4.1-mini
  temperature: 1.0
  base_url: https://api.openai.com/v1
  api_key: OPENAI_API_KEY

response_schema_path: resources/response_schema.json

agents:
  agent_001:
    name: PROGRAMMER
    model: gpt-4.1-mini
    temperature: 1.0
    base_url: https://api.openai.com/v1
    api_key: OPENAI_API_KEY
  agent_002:
    name: PLANNER
    model: gpt-4.1-mini
    temperature: 1.0
    base_url: https://api.openai.com/v1
    api_key: OPENAI_API_KEY
  agent_003:
    name: BAW_AGENT
    model: gpt-4.1-mini
    temperature: 1.0
    base_url: https://api.openai.com/v1
    api_key: OPENAI_API_KEY
