<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session {{ session_id }}</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #111827; color: #f9fafb; }
      .panel { background: #1f2937; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
      .message { border-bottom: 1px solid #374151; padding: 10px 0; }
      .role { font-weight: bold; color: #93c5fd; }
      pre { white-space: pre-wrap; word-break: break-word; }
      a { color: #93c5fd; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Session history: {{ session_id }}</h1>
      <p><a href="/">Back to dashboard</a></p>
    </div>

    <div class="panel">
      {% for message in messages %}
        <div class="message">
          <div class="role">{{ message.role }}</div>
          <pre>{{ message.content if message.content is not none else message }}</pre>
        </div>
      {% else %}
        <p>No messages found for this session.</p>
      {% endfor %}
    </div>
  </body>
</html>
